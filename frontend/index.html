<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Developer Persona Generator</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.7);
            --border-color: rgba(240, 246, 252, 0.1);
            --accent-color: #238636;
            --accent-glow: #2ea043;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --error-color: #f85149;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Fade-in Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container {
            width: 100%;
            max-width: 600px;
            animation: fadeIn 0.8s ease-out forwards;
        }

        /* Glassmorphism Card */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #fff, #8b949e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subheading {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            background: rgba(13, 17, 23, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 20px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--accent-glow);
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* Glowing Effect */
        button:hover {
            background-color: var(--accent-glow);
            box-shadow: 0 0 20px rgba(46, 160, 67, 0.4);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        /* Loading Spinner */
        .loader {
            display: none;
            margin: 20px auto;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--accent-glow);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Result Container */
        #result {
            margin-top: 30px;
            text-align: left;
            animation: fadeIn 0.5s ease-in;
        }

        .error {
            color: var(--error-color);
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid rgba(248, 81, 73, 0.2);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 0.9rem;
        }

        /* Responsive Adjustments */
        @media (max-width: 480px) {
            .card {
                padding: 25px;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>AI Developer Persona Generator</h1>
            <p class="subheading">Analyze any GitHub developer with Gemini AI</p>

            <div class="input-group">
                <input type="text" id="username" placeholder="Enter GitHub username (e.g. octocat)" spellcheck="false">
                <button id="generateBtn">Generate Persona</button>
            </div>

            <div id="loader" class="loader"></div>
            <div id="result"></div>
        </div>
    </div>

    <script>
        const usernameInput = document.getElementById('username');
        const generateBtn = document.getElementById('generateBtn');
        const loader = document.getElementById('loader');
        const resultContainer = document.getElementById('result');

        async function generatePersona() {
            const username = usernameInput.value.trim();
            
            if (!username) {
                showError('Please enter a GitHub username.');
                return;
            }

            // Reset UI
            resultContainer.innerHTML = '';
            loader.style.display = 'block';
            generateBtn.disabled = true;
            generateBtn.innerText = 'Analyzing...';

            try {
                const response = await fetch(`http://127.0.0.1:8080/card/${username}`);
                
                if (!response.ok) {
                    throw new Error(`Server responded with ${response.status}: ${response.statusText}`);
                }

                const htmlContent = await response.text();
                
                // Render the returned HTML
                resultContainer.innerHTML = htmlContent;
                
            } catch (error) {
                console.error('Fetch error:', error);
                showError(`Failed to generate persona. ${error.message}`);
            } finally {
                loader.style.display = 'none';
                generateBtn.disabled = false;
                generateBtn.innerText = 'Generate Persona';
            }
        }

        function showError(message) {
            resultContainer.innerHTML = `<div class="error">${message}</div>`;
        }

        generateBtn.addEventListener('click', generatePersona);

        // Allow pressing Enter to trigger generation
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                generatePersona();
            }
        });
    </script>
</body>
</html>
